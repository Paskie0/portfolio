name: Pathé watch check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check-watches:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-watches endpoint
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ vars.SITE_URL }}/api/cron/check-watches"
